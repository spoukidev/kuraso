<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Save to Kuraso</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #faf8f3;
        color: #1c1b19;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #57534e;
        margin: 0 0 12px;
        word-break: break-all;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #1d4ed8;
        color: #fff;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h1>Save to Kuraso</h1>
    <p id="status">Inspecting current tab…</p>
    <button id="sendBtn" disabled>Open in Kuraso Desktop</button>
    <script src="popup.js"></script>
  </body>
</html>
