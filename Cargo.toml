[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/kuraso-pdf",
    "crates/kuraso-library",
    "crates/kuraso-index",
    "crates/kuraso-ai",
]

[workspace.package]
version = "2.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/kuraso-app/kuraso"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tracing = "0.1"
