name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Run format schema tests
        run: npm run test:formats
      - name: Run reader coordinate & search tests
        run: npm run test:reader
      - name: Run importer & metadata tests
        run: npm run test:importers
      - name: Run W3C annotation & remapping tests
        run: npm run test:annotations
      - name: Run grounded AI & offline isolation tests
        run: npm run test:ai
      - name: Run Markdown & BibTeX exporter tests
        run: npm run test:exporters
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Build desktop frontend
        run: pnpm build
      - name: Dry-run PDFium fetch script
        run: node scripts/fetch-pdfium.mjs --dry-run

  rust-workspace:
    name: Rust Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri 2 system dependencies (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --workspace
